[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "proyecto2_deep_learning"
version = "0.0.1"
description = "Using CTGAN with sdv to expand and balance classes in financial loan data"
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["proyecto2_deep_learning"]
include = ["pyproject.toml", "proyecto2_deep_learning/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["proyecto2_deep_learning"]
force-sort-within-sections = true

